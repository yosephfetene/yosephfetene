<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="820" height="300" viewBox="0 0 820 300" role="img" aria-label="Terminal intro: Yoseph Fetene, CS student in Addis Ababa building backend systems in Rust and applied AI">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; white-space: pre; }
    .prompt { fill: #3fb950; }
    .cmd { fill: #e6edf3; }
    .out { fill: #8b949e; }
    .hi { fill: #58a6ff; }
    .rust { fill: #f74c00; font-weight: 700; }
    .ok { fill: #3fb950; font-weight: 700; }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="818" height="298" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M1 13 a12 12 0 0 1 12 -12 h794 a12 12 0 0 1 12 12 v25 h-818 z" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="20" r="6" fill="#febc2e"/>
  <circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="410" y="25" text-anchor="middle" class="mono out" style="font-size:13px">yoseph@addis-ababa: ~</text>

  <!-- typing clips for commands -->
  <defs>
    <clipPath id="c1"><rect x="24" y="56" height="24" width="0"><animate attributeName="width" from="0" to="100" begin="0.3s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="24" y="104" height="24" width="0"><animate attributeName="width" from="0" to="160" begin="1.6s" dur="0.8s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="24" y="152" height="24" width="0"><animate attributeName="width" from="0" to="150" begin="3.1s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="24" y="200" height="24" width="0"><animate attributeName="width" from="0" to="210" begin="4.5s" dur="0.8s" fill="freeze"/></rect></clipPath>
  </defs>

  <g class="mono">
    <text x="24" y="72" clip-path="url(#c1)"><tspan class="prompt">$ </tspan><tspan class="cmd">whoami</tspan></text>
    <text x="24" y="96" opacity="0" class="out">yoseph fetene · <tspan class="hi">cs student</tspan> · addis ababa, ethiopia
      <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.2s" fill="freeze"/></text>

    <text x="24" y="120" clip-path="url(#c2)"><tspan class="prompt">$ </tspan><tspan class="cmd">cat focus.txt</tspan></text>
    <text x="24" y="144" opacity="0" class="out">backend systems · <tspan class="rust">rust</tspan> · postgres · applied ai (rag)
      <animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.2s" fill="freeze"/></text>

    <text x="24" y="168" clip-path="url(#c3)"><tspan class="prompt">$ </tspan><tspan class="cmd">ls projects/</tspan></text>
    <text x="24" y="192" opacity="0" class="hi">WebInventory&#160;&#160;&#160;EPL-RAG&#160;&#160;&#160;pdf-scribe&#160;&#160;&#160;Studio-Workstation
      <animate attributeName="opacity" from="0" to="1" begin="4.0s" dur="0.2s" fill="freeze"/></text>

    <text x="24" y="216" clip-path="url(#c4)"><tspan class="prompt">$ </tspan><tspan class="cmd">cargo run --release</tspan></text>
    <text x="24" y="240" opacity="0" class="out">&#160;&#160;&#160;<tspan class="rust">Compiling</tspan> yoseph v0.3.0 (third year)
      <animate attributeName="opacity" from="0" to="1" begin="5.6s" dur="0.2s" fill="freeze"/></text>
    <text x="24" y="264" opacity="0" class="out">&#160;&#160;&#160;&#160;<tspan class="ok">Finished</tspan>&#160;learning by shipping real projects
      <animate attributeName="opacity" from="0" to="1" begin="6.3s" dur="0.2s" fill="freeze"/></text>
  </g>

  <!-- blinking cursor -->
  <rect x="24" y="274" width="9" height="16" fill="#e6edf3" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" begin="6.6s" repeatCount="indefinite"/>
  </rect>
</svg>
